[project]
name = "apriori3d-lab"
requires-python = ">=3.10,<3.11"
description = "Experimental geometry tools and notebooks for 3D reconstruction."
version = "0.1.0"

[tool.poetry]
packages = [
    { include = "apriori/flow", from = "src" },
    { include = "apriori/geometry", from = "src" },
]

[tool.poetry.dependencies]
mypy = "^1.18.2"
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]
ignore = ["E501"]  # line too long — мы всё равно ограничиваем line-length

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow unused imports in __init__

[tool.mypy]
mypy_path = "src"
strict = true
namespace_packages = true
explicit_package_bases = true


[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-v"
