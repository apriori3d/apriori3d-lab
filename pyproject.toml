[project]
name = "apriori3d-lab"
description = "Experimental geometry tools and notebooks for 3D reconstruction."
version = "0.1.0"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["apriori"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["apriori"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]
ignore = ["E501"]  # line too long — мы всё равно ограничиваем line-length

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow unused imports in __init__
